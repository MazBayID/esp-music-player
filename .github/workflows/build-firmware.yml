name: Build firmware
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli config init && arduino-cli core update-index && arduino-cli core install esp32:esp32
      - run: arduino-cli lib update-index && arduino-cli lib install ESP8266Audio WiFiManager 'Adafruit GFX Library' 'Adafruit SSD1306'
      - run: mkdir -p build && arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir build firmware/esp32c3_music_player.ino
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-c3-firmware-bin
          path: build/*.bin
          if-no-files-found: error
