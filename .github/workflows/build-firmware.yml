name: Build ESP32-C3 firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 platform
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install required libraries
        run: |
          arduino-cli lib update-index
          arduino-cli lib install ESP8266Audio
          arduino-cli lib install WiFiManager
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit SSD1306"

      - name: Compile modular sketch for ESP32-C3
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --board-options PartitionScheme=huge_app --warnings all --export-binaries --output-dir build firmware/NeoMusicPlayer
          find build -maxdepth 1 -type f -name '*.bin' -print
          test -n "$(find build -maxdepth 1 -type f -name '*.bin' -print -quit)"

      - name: Merge bootloader, partitions, and application into one BIN
        run: |
          python -m pip install esptool
          APP_BIN="$(find build -maxdepth 1 -type f -name '*.ino.bin' ! -name '*.bootloader.bin' ! -name '*.partitions.bin' ! -name '*.boot_app0.bin' -print -quit)"
          BOOTLOADER_BIN="$(find build -maxdepth 1 -type f -name '*.bootloader.bin' -print -quit)"
          PARTITIONS_BIN="$(find build -maxdepth 1 -type f -name '*.partitions.bin' -print -quit)"
          BOOT_APP0_BIN="$(find "$HOME/.arduino15/packages/esp32/hardware/esp32" -path '*/tools/partitions/boot_app0.bin' -print -quit)"
          test -n "$APP_BIN"
          test -n "$BOOTLOADER_BIN"
          test -n "$PARTITIONS_BIN"
          test -n "$BOOT_APP0_BIN"
          python -m esptool --chip esp32c3 merge-bin -o build/neo_music_player_merged.bin --flash-mode dio --flash-size 4MB 0x0 "$BOOTLOADER_BIN" 0x8000 "$PARTITIONS_BIN" 0xe000 "$BOOT_APP0_BIN" 0x10000 "$APP_BIN"
          test -s build/neo_music_player_merged.bin

      - name: Upload single-file firmware BIN
        uses: actions/upload-artifact@v4
        with:
          name: neo-music-player-esp32-c3-firmware
          path: build/neo_music_player_merged.bin
          if-no-files-found: error
          retention-days: 30
